## maddy — почтовый сервер Автодонора, только на отправку.
##
## Сайт отдаёт письма (подтверждение email) на 127.0.0.1:587, maddy
## подписывает их DKIM и доставляет напрямую на MX получателя по порту 25.
## Почту maddy не принимает: порт 25 не слушается, IMAP выключен,
## наружу не открыто ничего. Ставится deploy/install-maddy.sh, лежит
## в /etc/maddy/maddy.conf.
##
## Чтобы письма не уходили в спам, у домена нужны записи DNS (SPF, DKIM,
## DMARC) и обратная запись PTR для IP — их печатает install-maddy.sh.

$(hostname) = avt.vpn-x.fun
$(primary_domain) = avt.vpn-x.fun
$(local_domains) = $(primary_domain)

# TLS не нужен: единственный вход — localhost, письмо не покидает машину.
# Исходящие к чужим MX maddy всё равно шифрует (STARTTLS) — это настройка
# клиента в outbound_delivery, а не этот сертификат
tls off

hostname $(hostname)

# Учётки отправителей: maddy creds create noreply@avt.vpn-x.fun
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

# Ящик только для postmaster — туда ложатся отчёты о недоставке
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

msgpipeline local_routing {
    destination postmaster $(local_domains) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

submission tcp://127.0.0.1:587 {
    # Пароль открытым текстом — только потому, что слушаем один localhost
    insecure_auth yes
    limits {
        all rate 20 1s
    }
    auth &local_authdb

    source $(local_domains) {
        # Отправлять можно только от своего имени: noreply@ — от noreply@
        check {
            authorize_sender {
                user_to_email identity
            }
        }
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            modify {
                dkim $(primary_domain) $(local_domains) default
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

target.remote outbound_delivery {
    limits {
        destination rate 20 1s
        destination concurrency 10
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

target.queue remote_queue {
    target &outbound_delivery
    autogenerated_msg_domain $(primary_domain)
    bounce {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
        }
    }
}
