<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог запчастей с разбора</title>
<style>
:root{
  --paper:#f7f6f3; --card:#fff; --line:#e2ded6; --line-2:#d0cabe;
  --ink:#16181c; --muted:#6b7280; --dim:#9aa1ac;
  --amber:#e8a200; --amber-soft:#fff6de;
  --ok:#1a7f4b; --warn:#b45309; --err:#c0392b;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;align-items:center;gap:16px;padding-top:16px;padding-bottom:16px}
header .logo{font-weight:700;font-size:17px;letter-spacing:-.02em}
header .logo span{color:var(--amber)}
header nav{margin-left:auto;display:flex;gap:18px;font-size:14px;color:var(--muted)}

/* --- VIN как главный вход, а не как один из фильтров --- */
.hero{background:var(--card);border-bottom:1px solid var(--line);padding:38px 0 34px}
.hero h1{margin:0 0 6px;font-size:27px;letter-spacing:-.025em;font-weight:700}
.hero p{margin:0 0 20px;color:var(--muted);font-size:15px;max-width:52ch}
.vinbar{display:flex;gap:10px;max-width:620px}
.vinbar input{flex:1;font-family:var(--mono);font-size:19px;letter-spacing:.14em;
  text-transform:uppercase;padding:14px 16px;border:2px solid var(--line-2);
  border-radius:10px;background:var(--paper);color:var(--ink);outline:none;min-width:0}
.vinbar input:focus{border-color:var(--amber);background:#fff}
.vinbar input.bad{border-color:var(--err)}
.vinbar button{background:var(--ink);color:#fff;border:0;border-radius:10px;
  padding:14px 26px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.vinbar button:disabled{opacity:.3;cursor:not-allowed}
.hero .alt{margin:14px 0 0;font-size:14px;color:var(--muted)}
.hero .alt button{background:none;border:0;color:var(--ink);text-decoration:underline;
  cursor:pointer;font-size:14px;padding:0;font-family:inherit}

/* --- результат распознавания --- */
.resolved{margin-top:18px;border-radius:11px;padding:16px 18px;max-width:620px}
.resolved.exact{background:var(--amber-soft);border:1px solid #f0d488}
.resolved.partial{background:#fff;border:1px solid var(--line)}
.resolved.miss{background:#fff;border:1px solid var(--line)}
.resolved h3{margin:0 0 4px;font-size:16px}
.resolved p{margin:0;font-size:13px;color:var(--muted)}
.resolved .cands{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.resolved .cands button{background:var(--paper);border:1px solid var(--line-2);
  border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;text-align:left;font-family:inherit}
.resolved .cands button:hover{border-color:var(--amber)}
.resolved .cands b{display:block;font-weight:600}
.resolved .cands small{color:var(--dim)}
.disclaimer{margin-top:12px;font-size:12.5px;color:var(--warn);
  padding-left:20px;position:relative;line-height:1.45}
.disclaimer::before{content:"!";position:absolute;left:0;top:0;font-weight:700}

/* --- раскладка --- */
.body{display:grid;grid-template-columns:230px 1fr;gap:30px;padding:28px 0 70px;align-items:start}
@media(max-width:820px){.body{grid-template-columns:1fr}.side{order:2}}

.side section{margin-bottom:24px}
.side h4{margin:0 0 10px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.side label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;cursor:pointer}
.side label input{accent-color:var(--amber)}
.side label .n{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.side .range{display:flex;gap:8px}
.side .range input{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);font-size:14px;font-family:inherit}
.side .reset{background:none;border:0;color:var(--muted);text-decoration:underline;
  cursor:pointer;font-size:13px;padding:0;font-family:inherit}

.toolbar{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .count{font-size:14px;color:var(--muted)}
.toolbar select{margin-left:auto;padding:8px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:14px;font-family:inherit}
.searchbar{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);font-size:15px;font-family:inherit;margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;display:flex;flex-direction:column;text-decoration:none;
  transition:border-color .13s,transform .13s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:var(--paper);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .none{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--dim);font-size:13px}
.card .cond{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);
  border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.card .in{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .nm{font-size:14.5px;line-height:1.3;font-weight:500}
.card .car{font-size:12.5px;color:var(--muted)}
.card .oem{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.card .pr{margin-top:auto;padding-top:8px;font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums}
.card .pr small{font-weight:400;font-size:12px;color:var(--muted);display:block}

.empty{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:44px 28px;text-align:center}
.empty h3{margin:0 0 8px;font-size:17px}
.empty p{margin:0;color:var(--muted);font-size:14px}

.pager{display:flex;gap:8px;justify-content:center;margin-top:28px}
.pager button{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:9px 15px;cursor:pointer;font-size:14px;font-family:inherit}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="logo">РАЗБОР<span>·</span>ПАРТС</span>
    <nav>
      <a href="/catalog">Каталог</a>
      <a href="/delivery">Доставка</a>
      <a href="/contacts">Контакты</a>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <h1>Найдите деталь по VIN своей машины</h1>
    <p>Введите VIN из ПТС или свидетельства о регистрации — покажем только то,
       что встанет на вашу машину.</p>

    <div class="vinbar">
      <input id="vin" maxlength="17" spellcheck="false" autocomplete="off"
             placeholder="XTA210740X1234567" aria-label="VIN автомобиля">
      <button id="vinGo" disabled>Подобрать</button>
    </div>

    <p class="alt">Не знаете VIN? <button id="byModel">Выбрать машину по марке и модели</button></p>

    <div id="resolved"></div>
  </div>
</div>

<div class="wrap body">

  <aside class="side" id="side" hidden>
    <section>
      <h4>Узел</h4>
      <div id="cats"></div>
    </section>
    <section>
      <h4>Состояние</h4>
      <div id="conds"></div>
    </section>
    <section>
      <h4>Цена, ₽</h4>
      <div class="range">
        <input type="number" id="pmin" placeholder="от" inputmode="numeric">
        <input type="number" id="pmax" placeholder="до" inputmode="numeric">
      </div>
    </section>
    <button class="reset" id="reset">Сбросить фильтры</button>
  </aside>

  <main>
    <input class="searchbar" id="q" placeholder="Название или каталожный номер"
           autocomplete="off" aria-label="Поиск по названию или номеру">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <select id="sort">
        <option value="new">Сначала новые</option>
        <option value="price_asc">Сначала дешёвые</option>
        <option value="price_desc">Сначала дорогие</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>

</div>

<script>
const $ = id => document.getElementById(id);
const state = {
  generation_id:null, modification_id:null, category_id:null,
  condition:[], price_min:null, price_max:null, q:'', sort:'new', page:1
};

// ---- VIN ------------------------------------------------------------
$('vin').addEventListener('input', e => {
  const v = e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
  e.target.value = v;
  e.target.classList.remove('bad');
  $('vinGo').disabled = v.length !== 17;
});
$('vin').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('vinGo').disabled) findByVin(); });
$('vinGo').onclick = findByVin;

async function findByVin(){
  $('vinGo').disabled = true;
  $('vinGo').textContent = 'Ищу…';
  try {
    const d = await (await fetch('/api/catalog/vin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vin: $('vin').value})
    })).json();
    showResolution(d);
  } finally {
    $('vinGo').disabled = false;
    $('vinGo').textContent = 'Подобрать';
  }
}

const DISCLAIMER = `<p class="disclaimer">Подбор по VIN определяет поколение кузова,
  но не точную комплектацию. Перед покупкой сверьте каталожный номер
  со своей деталью — это исключит возврат.</p>`;

function showResolution(d){
  const box = $('resolved');

  if (d.resolution === 'invalid'){
    $('vin').classList.add('bad');
    box.innerHTML = `<div class="resolved miss">
      <h3>Не похоже на VIN</h3>
      <p>${d.errors.join('. ')}. Проверьте номер — он в ПТС и на табличке под капотом.</p></div>`;
    return;
  }

  if (d.resolution === 'exact'){
    box.innerHTML = `<div class="resolved exact">
      <h3>${d.brand} ${d.model} ${d.generation}${d.body_type ? ', ' + d.body_type : ''}</h3>
      <p>${d.year_from}–${d.year_to || 'н.в.'}${d.year ? ' · ваш год: ' + d.year : ''} ·
         подходящих деталей: ${d.results_count}</p>
      ${DISCLAIMER}</div>`;
    state.generation_id = d.generation_id;
    state.modification_id = d.modification_id;
    openCatalog();
    return;
  }

  if (d.resolution === 'brand_year'){
    box.innerHTML = `<div class="resolved partial">
      <h3>${d.manufacturer}${d.year ? ', ' + d.year + ' год' : ''}</h3>
      <p>Точную модель по этому VIN определить не удалось. Выберите свою:</p>
      <div class="cands">${d.candidates.map(c => `
        <button data-gen="${c.generation_id}">
          <b>${c.brand} ${c.model}</b>
          <small>${c.generation}${c.body_type ? ', ' + c.body_type : ''} ·
                 ${c.year_from}–${c.year_to || 'н.в.'} · ${c.parts_count} дет.</small>
        </button>`).join('')}</div>
      ${DISCLAIMER}</div>`;
    box.querySelectorAll('.cands button').forEach(b => b.onclick = () => {
      state.generation_id = +b.dataset.gen;
      state.modification_id = null;
      box.querySelector('h3').textContent = b.querySelector('b').textContent;
      box.querySelector('.cands').remove();
      box.querySelector('p').textContent = 'Показаны детали для выбранной модели.';
      openCatalog();
    });
    return;
  }

  box.innerHTML = `<div class="resolved miss">
    <h3>Такую машину мы пока не разбирали</h3>
    <p>${d.country ? d.country + ', ' : ''}${d.year ? d.year + ' год' : ''} —
       но модель определить не смогли. Ваш запрос записан: если такая машина
       появится на разборе, детали для неё будут в каталоге.
       Посмотрите общий каталог или напишите нам, что именно нужно.</p></div>`;
  openCatalog();
}

$('byModel').onclick = () => { state.generation_id = null; openCatalog(); };

function openCatalog(){
  $('side').hidden = false;
  state.page = 1; state.category_id = null; state.condition = [];
  loadFacets();
  loadParts();
  document.querySelector('.body').scrollIntoView({behavior:'smooth', block:'start'});
}

// ---- фасеты ---------------------------------------------------------
async function loadFacets(){
  const p = new URLSearchParams();
  if (state.generation_id) p.set('generation_id', state.generation_id);
  if (state.modification_id) p.set('modification_id', state.modification_id);
  const f = await (await fetch('/api/catalog/facets?' + p)).json();

  $('cats').innerHTML = f.categories.map(c => `
    <label><input type="radio" name="cat" value="${c.id}">
      ${c.name}<span class="n">${c.cnt}</span></label>`).join('')
    || '<p style="color:var(--dim);font-size:13px;margin:0">Нет деталей</p>';
  $('cats').querySelectorAll('input').forEach(i => i.onchange = () => {
    state.category_id = +i.value; state.page = 1; loadParts();
  });

  $('conds').innerHTML = f.conditions.map(c => `
    <label><input type="checkbox" value="${c.condition}">
      ${c.condition} — ${c.label}<span class="n">${c.cnt}</span></label>`).join('');
  $('conds').querySelectorAll('input').forEach(i => i.onchange = () => {
    state.condition = [...$('conds').querySelectorAll('input:checked')].map(x => x.value);
    state.page = 1; loadParts();
  });

  if (f.price.min != null){
    $('pmin').placeholder = 'от ' + f.price.min;
    $('pmax').placeholder = 'до ' + f.price.max;
  }
}

// ---- выдача ---------------------------------------------------------
let debounce;
['pmin','pmax'].forEach(id => $(id).addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    state.price_min = $('pmin').value || null;
    state.price_max = $('pmax').value || null;
    state.page = 1; loadParts();
  }, 450);
}));
$('q').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = $('q').value.trim(); state.page = 1; loadParts(); }, 350);
});
$('sort').onchange = () => { state.sort = $('sort').value; state.page = 1; loadParts(); };
$('reset').onclick = () => {
  state.category_id = null; state.condition = []; state.price_min = null;
  state.price_max = null; state.q = ''; state.page = 1;
  $('q').value = ''; $('pmin').value = ''; $('pmax').value = '';
  loadFacets(); loadParts();
};

async function loadParts(){
  const p = new URLSearchParams();
  Object.entries(state).forEach(([k, v]) => {
    if (v === null || v === '' || (Array.isArray(v) && !v.length)) return;
    p.set(k, Array.isArray(v) ? v.join(',') : v);
  });

  const d = await (await fetch('/api/catalog/parts?' + p)).json();
  $('count').textContent = d.total
    ? `${d.total} ${plural(d.total, 'деталь','детали','деталей')}`
    : '';

  if (!d.items.length){
    $('grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h3>Ничего не нашлось</h3>
      <p>Попробуйте убрать часть фильтров или напишите нам — деталь может быть
         ещё не выложена, но лежать на складе.</p></div>`;
    $('pager').innerHTML = '';
    return;
  }

  $('grid').innerHTML = d.items.map(i => `
    <a class="card" href="/p/${i.sku}">
      <div class="ph">
        ${i.photo ? `<img src="${i.photo}" alt="${i.name}" loading="lazy">`
                  : '<div class="none">без фото</div>'}
        <span class="cond">${i.condition}</span>
      </div>
      <div class="in">
        <span class="nm">${i.name}</span>
        <span class="car">${i.brand} ${i.model}${i.year ? ', ' + i.year : ''}</span>
        ${i.oem_number ? `<span class="oem">${i.oem_number}</span>` : ''}
        <span class="pr">${i.price ? Number(i.price).toLocaleString('ru') + ' ₽'
                                   : 'Цена по запросу'}
          <small>${i.category}</small></span>
      </div>
    </a>`).join('');

  renderPager(d);
}

function renderPager(d){
  if (d.pages <= 1){ $('pager').innerHTML = ''; return; }
  let html = `<button ${d.page === 1 ? 'disabled' : ''} data-p="${d.page - 1}">Назад</button>`;
  for (let i = 1; i <= d.pages; i++){
    if (i === 1 || i === d.pages || Math.abs(i - d.page) <= 1)
      html += `<button class="${i === d.page ? 'on' : ''}" data-p="${i}">${i}</button>`;
    else if (Math.abs(i - d.page) === 2) html += '<span style="padding:9px 4px">…</span>';
  }
  html += `<button ${d.page === d.pages ? 'disabled' : ''} data-p="${d.page + 1}">Вперёд</button>`;
  $('pager').innerHTML = html;
  $('pager').querySelectorAll('button[data-p]').forEach(b => b.onclick = () => {
    state.page = +b.dataset.p;
    loadParts();
    window.scrollTo({top: document.querySelector('.body').offsetTop - 20, behavior:'smooth'});
  });
}

const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
};

$('vin').focus();
</script>
</body>
</html>
