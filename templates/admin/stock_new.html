<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приём запчасти</title>
<style>
:root{--bg:#12161c;--panel:#181d25;--panel-2:#1f2630;--line:#2b333f;--ink:#e8ecf2;
--muted:#8794a6;--dim:#5c6878;--amber:#ffc233;--ok:#4cc38a;--warn:#ff9f2e;--err:#ff5f56}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}
.top{background:var(--panel);border-bottom:1px solid var(--line);margin-bottom:20px}
.top .wrap{display:flex;align-items:center;gap:14px;padding:14px 16px}
.top h1{margin:0;font-size:17px;font-weight:600}
.top nav{margin-left:auto;font-size:14px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
font-weight:600;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
padding:18px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);
border-radius:9px;color:var(--ink);padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--amber)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{filter:invert(.85);opacity:.5}
input[type=number]:hover::-webkit-inner-spin-button,
input[type=number]:focus::-webkit-inner-spin-button{opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shoot{display:block;width:100%;padding:24px;border:1px dashed var(--line);border-radius:10px;
background:none;color:var(--muted);cursor:pointer;font-size:16px;font-family:inherit}
.shoot:hover{border-color:var(--amber);color:var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.results{margin-top:8px;max-height:220px;overflow-y:auto;border:1px solid var(--line);
border-radius:9px;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;
border-bottom:1px solid var(--line);color:var(--ink);padding:12px 14px;cursor:pointer;
font-family:inherit;font-size:15px}
.results button:last-child{border-bottom:0}
.results .path{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.picked{display:flex;align-items:center;gap:10px;background:var(--panel-2);
border:1px solid rgba(255,194,51,.4);border-radius:9px;padding:12px 14px}
.picked .path{font-size:12px;color:var(--muted)}
.picked button{margin-left:auto;background:none;border:0;color:var(--dim);font-size:20px;
cursor:pointer;font-family:inherit}
.cond{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cond button{padding:14px 0;border-radius:10px;background:var(--panel-2);
border:1px solid var(--line);color:var(--muted);cursor:pointer;font-family:inherit;line-height:1.2}
.cond button b{display:block;font-size:20px;margin-bottom:2px}
.cond button small{font-size:10px}
.cond button.on{background:rgba(255,194,51,.14);border-color:var(--amber);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);
border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px}
.chip button{background:none;border:0;color:var(--err);cursor:pointer;font-size:17px;
padding:0;font-family:inherit}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.warn{background:rgba(255,159,46,.1);border:1px solid rgba(255,159,46,.3);color:#ffc98a;
border-radius:8px;padding:11px 14px;font-size:13.5px;margin-top:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.primary{background:var(--amber);color:#1a1408;border:0;border-radius:10px;padding:14px 20px;
font-weight:600;flex:1;cursor:pointer;font-size:15px;font-family:inherit}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;color:var(--muted);border:1px solid var(--line);border-radius:10px;
padding:14px 16px;cursor:pointer;font-family:inherit;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--panel-2);
border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-size:14px;opacity:0;
transition:.2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
.toast.ok{border-color:rgba(76,195,138,.5)}
.toast.err{border-color:rgba(255,95,86,.5);color:#ff9a94}
</style></head><body>

{% include "admin/_nav.html" %}

<div class="wrap">

<section class="panel">
  <p class="eyebrow">Деталь</p>
  <button type="button" class="shoot" id="shoot">📷 Снять деталь</button>
  <input type="file" id="photos" accept="image/*" multiple capture="environment" hidden>
  <div class="thumbs" id="thumbs"></div>

  <div id="catBox" style="margin-top:18px">
    <label for="catSearch">Что это за деталь</label>
    <input type="text" id="catSearch" placeholder="дверь пер, фара, стойка…" autocomplete="off">
    <div class="results" id="catResults"></div>
  </div>
  <div class="picked" id="catPicked" hidden>
    <div style="min-width:0">
      <div id="pickedName"></div><div class="path" id="pickedPath"></div>
    </div>
    <button type="button" id="catClear">×</button>
  </div>

  <div style="margin-top:18px">
    <label>Состояние</label>
    <div class="cond" id="cond">
      <button type="button" data-c="A"><b>A</b><small>отличное</small></button>
      <button type="button" data-c="B"><b>B</b><small>рабочее</small></button>
      <button type="button" data-c="C"><b>C</b><small>с дефектом</small></button>
      <button type="button" data-c="D"><b>D</b><small>под ремонт</small></button>
    </div>
  </div>

  <div class="row" style="margin-top:18px">
    <div>
      <label for="source">Откуда поступила</label>
      <select id="source">
        {% for k, v in sources.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div><label for="price">Цена, ₽</label>
      <input type="number" id="price" min="0" step="50" inputmode="numeric"></div>
  </div>

  <div class="row" style="margin-top:14px">
    <div><label for="oem">Каталожный номер</label><input type="text" id="oem" autocomplete="off"></div>
    <div><label for="loc">Место хранения</label><input type="text" id="loc" autocomplete="off"></div>
  </div>

  <div style="margin-top:14px">
    <label for="note">Дефекты</label>
    <input type="text" id="note" placeholder="потёртость, скол">
  </div>
</section>

<section class="panel">
  <p class="eyebrow">К каким машинам подходит</p>
  <p class="hint">Деталь снята не с машины, поэтому применимость нужно указать
     вручную — иначе покупатель её не найдёт ни по одному фильтру.</p>

  <div class="row"><div>
    <label for="brand">Марка</label><select id="brand"></select></div>
    <div><label for="model">Модель</label><select id="model" disabled></select></div>
  </div>
  <div style="margin-top:12px">
    <label for="generation">Поколение</label><select id="generation" disabled></select>
  </div>
  <button type="button" class="ghost" id="addFit" style="margin-top:12px;width:100%" disabled>
    Добавить в список
  </button>

  <div class="chips" id="fits"></div>
  <div class="warn" id="noFits">Пока не выбрано ни одной модели</div>
</section>

</div>

<div class="bar"><div class="inner">
  <button class="primary" id="save" disabled>Выберите деталь</button>
  <button class="ghost" id="reset">Очистить</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let category=null, condition=null, files=[], fits=[];

// --- фото ---
$('shoot').onclick = () => $('photos').click();
$('photos').onchange = async e => {
  for (const f of e.target.files){
    const blob = await cropImage(f);
    if (blob) files.push(new File([blob], 'photo.jpg', {type:'image/jpeg'}));
  }
  e.target.value='';
  $('thumbs').innerHTML='';
  files.forEach(f=>{const i=document.createElement('img');i.src=URL.createObjectURL(f);
    i.onload=()=>URL.revokeObjectURL(i.src);$('thumbs').appendChild(i);});
  $('shoot').textContent = files.length ? `Добавить ещё фото (${files.length})` : '📷 Снять деталь';
  refresh();
};

// --- категория ---
let t;
$('catSearch').oninput = e => { clearTimeout(t);
  t=setTimeout(()=>searchCats(e.target.value.trim()),250); };
$('catSearch').onfocus = () => searchCats($('catSearch').value.trim());


// Путь до родителя: имя узла и так стоит в заголовке строки
function parentPath(path){
  const parts = (path || '').split(' / ');
  return parts.length > 1 ? parts.slice(0, -1).join(' / ') : '';
}

async function searchCats(q){
  const rows = await (await fetch('/api/part-categories'+(q?`?q=${encodeURIComponent(q)}`:''))).json();
  const box=$('catResults'); box.innerHTML='';
  rows.forEach(r=>{const b=document.createElement('button');b.type='button';
    b.innerHTML=`${r.name}<span class="path">${parentPath(r.path)}</span>`;
    b.onclick=()=>pick(r); box.appendChild(b);});
  box.classList.toggle('open', rows.length>0);
}
function pick(r){ category=r; $('catBox').hidden=true; $('catPicked').hidden=false;
  $('pickedName').textContent=r.name; $('pickedPath').textContent=parentPath(r.path);
  $('catResults').classList.remove('open'); refresh(); }
$('catClear').onclick=()=>{category=null;$('catBox').hidden=false;$('catPicked').hidden=true;
  $('catSearch').value='';refresh();};

// --- состояние ---
$('cond').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  condition=b.dataset.c;
  [...$('cond').children].forEach(x=>x.classList.toggle('on',x===b)); refresh(); };

// --- применимость ---
async function fill(sel,url,fmt){ const el=$(sel); el.innerHTML='<option value="">—</option>';
  el.disabled=true; if(!url) return;
  (await (await fetch(url)).json()).forEach(r=>el.add(new Option(fmt(r), r.id)));
  el.disabled=false; }

const fmtGen = g => `${g.name}${g.body_type?', '+g.body_type:''} (${g.year_from}–${g.year_to||'н.в.'})`;

$('brand').onchange = async e => {
  await fill('model', e.target.value?`/api/models?brand_id=${e.target.value}`:null, r=>r.name);
  await fill('generation', null, x=>x); checkFit(); };
$('model').onchange = async e => {
  await fill('generation', e.target.value?`/api/generations?model_id=${e.target.value}`:null, fmtGen);
  checkFit(); };
$('generation').onchange = checkFit;
function checkFit(){ $('addFit').disabled = !$('generation').value; }

$('addFit').onclick = () => {
  const id = +$('generation').value;
  if (fits.some(f=>f.id===id)) return toast('Эта модель уже в списке');
  const label = `${$('brand').selectedOptions[0].text} ${$('model').selectedOptions[0].text} `
              + `${$('generation').selectedOptions[0].text}`;
  fits.push({id, label}); drawFits(); refresh();
};

function drawFits(){
  $('fits').innerHTML='';
  fits.forEach((f,i)=>{const c=document.createElement('div');c.className='chip';
    c.innerHTML=`<span>${f.label}</span>`;
    const b=document.createElement('button');b.textContent='×';
    b.onclick=()=>{fits.splice(i,1);drawFits();refresh();};
    c.appendChild(b);$('fits').appendChild(c);});
  $('noFits').hidden = fits.length>0;
}

// --- сохранение ---
function refresh(){
  const ok = category && condition && fits.length;
  $('save').disabled = !ok;
  if (!category)        $('save').textContent='Выберите деталь';
  else if (!condition)  $('save').textContent='Укажите состояние';
  else if (!fits.length)$('save').textContent='Укажите, к чему подходит';
  else if (!files.length) $('save').textContent='Принять без фото (черновик)';
  else                  $('save').textContent='Принять запчасть';
}

$('save').onclick = async () => {
  $('save').disabled=true;
  const fd=new FormData();
  fd.append('category_id',category.id);
  fd.append('name',category.name);
  fd.append('condition',condition);
  fd.append('source',$('source').value);
  fd.append('generations',fits.map(f=>f.id).join(','));
  [['oem','oem_number'],['price','price'],['loc','location'],['note','condition_note']]
    .forEach(([id,key])=>{ if($(id).value) fd.append(key,$(id).value); });
  files.forEach(f=>fd.append('files',f));

  try {
    const r=await fetch('/api/stock/parts',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok){ toast(d.detail||'Не удалось сохранить','err'); $('save').disabled=false; return; }
    toast(`${d.sku} — применимость: ${d.generations}`, 'ok');
    resetForm();
  } catch { toast('Нет связи','err'); $('save').disabled=false; }
};

function resetForm(){
  category=null; condition=null; files=[]; fits=[];
  $('catBox').hidden=false; $('catPicked').hidden=true; $('catSearch').value='';
  ['price','oem','note'].forEach(id=>$(id).value='');
  [...$('cond').children].forEach(x=>x.classList.remove('on'));
  $('thumbs').innerHTML=''; $('photos').value=''; $('shoot').textContent='📷 Снять деталь';
  drawFits(); refresh(); window.scrollTo({top:0,behavior:'smooth'});
}
$('reset').onclick=resetForm;

let tt;
function toast(m,k=''){ const el=$('toast'); el.textContent=m; el.className=`toast show ${k}`;
  clearTimeout(tt); tt=setTimeout(()=>el.className='toast',2600); }

document.addEventListener('click',e=>{ if(!e.target.closest('#catBox'))
  $('catResults').classList.remove('open'); });

fill('brand','/api/brands',r=>r.name);
drawFits(); refresh();
</script>
{% include "admin/_cropper.html" %}
</body></html>
