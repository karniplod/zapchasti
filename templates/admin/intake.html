<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приёмка автомобиля</title>
<link rel="stylesheet" href="/static/admin.css?v={{ admin_css_version() }}">
<style>
header{display:flex;align-items:baseline;gap:14px;margin-bottom:28px;
       padding-bottom:18px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
header .code{font-family:var(--mono);font-size:13px;color:var(--amber)}

/* --- VIN --- */
.vin-input{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:22px;
  letter-spacing:.22em;padding:14px 16px;text-transform:uppercase;outline:none}
.vin-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,194,51,.12)}
.vin-input.bad{border-color:var(--err)}

/* Посимвольная линейка: показывает приёмщику структуру номера */
.ruler{display:flex;gap:3px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.cell{flex:1 0 26px;text-align:center;font-family:var(--mono);font-size:15px;
  padding:7px 0 5px;border-radius:4px;background:var(--panel-2);
  border-top:2px solid transparent;color:var(--dim);transition:.12s}
.cell.filled{color:var(--ink)}
.seg-wmi.filled{border-top-color:#6ea8fe;background:rgba(110,168,254,.09)}
.seg-vds.filled{border-top-color:var(--amber);background:rgba(255,194,51,.09)}
.seg-chk.filled{border-top-color:var(--ok);background:rgba(76,195,138,.1)}
.seg-chk.filled.bad{border-top-color:var(--err);background:rgba(255,95,86,.12);color:var(--err)}
.seg-yr.filled{border-top-color:#c792ea;background:rgba(199,146,234,.09)}
.seg-ser.filled{border-top-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;
        font-size:11px;color:var(--dim);letter-spacing:.04em}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;
          margin-right:5px;vertical-align:1px}

/* --- результат декодирования --- */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:1px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.readout div{background:var(--panel-2);padding:11px 13px}
.readout dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
            color:var(--dim);margin-bottom:3px}
.readout dd{margin:0;font-size:14px}
.readout dd.mono{font-family:var(--mono)}

.note{display:flex;gap:9px;padding:10px 13px;border-radius:7px;font-size:13px;
      margin-top:10px;align-items:flex-start}
.note.warn{background:rgba(255,159,46,.1);color:#ffc98a;border:1px solid rgba(255,159,46,.25)}
.note.err{background:rgba(255,95,86,.1);color:#ff9a94;border:1px solid rgba(255,95,86,.3)}
.note.ok{background:rgba(76,195,138,.1);color:#8fe0b8;border:1px solid rgba(76,195,138,.25)}

/* --- поля --- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.auto{border-color:rgba(76,195,138,.45)!important}

.files{border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
       color:var(--muted);font-size:13px;cursor:pointer}
.files:hover{border-color:var(--amber);color:var(--ink)}

.bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);
     padding:22px 0 6px;display:flex;gap:12px;align-items:center}
.status{font-size:13px;color:var(--muted)}

/* Незаполненное обязательное поле. Через outline, а не border —
   рамка не занимает места и ничего не сдвигает при появлении */
.need{outline:1px dashed rgba(255,194,51,.6);outline-offset:6px;border-radius:8px}
.need-tag{color:var(--amber);font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;font-weight:600;margin-left:8px}
</style>
</head>
<body>
{% include "admin/_nav.html" %}

<div class="wrap">

<!-- VIN ---------------------------------------------------------->
<section class="panel">
  <p class="eyebrow">Идентификация<span class="need-tag" id="needVin" hidden>нужно заполнить</span></p>
  <input id="vin" class="vin-input" maxlength="17" spellcheck="false"
         autocomplete="off" placeholder="VIN — 17 символов">

  <div class="ruler" id="ruler"></div>
  <div class="legend">
    <span><i style="background:#6ea8fe"></i>1–3 завод</span>
    <span><i style="background:#ffc233"></i>4–8 модель</span>
    <span><i style="background:#4cc38a"></i>9 контроль</span>
    <span><i style="background:#c792ea"></i>10 год</span>
    <span><i style="background:#2b333f"></i>11–17 кузов</span>
  </div>

  <div id="readout"></div>
  <div id="notes"></div>

  <div style="margin-top:14px">
    <label><input type="checkbox" id="noVin" style="width:auto;margin-right:7px">
      VIN отсутствует или нечитаем (японец с номером кузова, спилен, сгнил)</label>
  </div>
</section>

<!-- Модель ------------------------------------------------------->
<section class="panel">
  <p class="eyebrow">Автомобиль</p>
  <div class="grid">
    <div><label for="brand">Марка</label><select id="brand"></select></div>
    <div><label for="model">Модель</label><select id="model" disabled></select></div>
    <div><label for="generation">Поколение<span class="need-tag" id="needGen" hidden>нужно</span></label>
      <select id="generation" disabled></select></div>
    <div><label for="modification">Модификация<span class="need-tag" id="needMod" hidden>нужно</span></label>
      <select id="modification" disabled></select></div>
  </div>
  <!-- Комплектация есть в справочнике не у всех модификаций — блок
       показывается только когда там реально что-то нашлось -->
  <div id="complectationBox" style="margin-top:14px" hidden>
    <label for="complectation">Комплектация</label>
    <select id="complectation"></select>
  </div>
</section>

<!-- Состояние ---------------------------------------------------->
<section class="panel">
  <p class="eyebrow">Состояние на момент приёмки</p>
  <div class="grid">
    <div><label for="year">Год выпуска</label><input type="number" id="year" min="1950" max="2030"></div>
    <div><label for="color">Цвет</label><input type="text" id="color"></div>
    <div><label for="mileage">Пробег, км</label><input type="number" id="mileage" min="0"></div>
    <div><label for="plate">Госномер</label><input type="text" id="plate"></div>
    <div><label for="price">Цена закупки, ₽</label><input type="number" id="price" min="0" step="100"></div>
    <div><label for="acceptedAt">Дата приёмки</label>
      <input type="date" id="acceptedAt" min="2000-01-01"></div>
  </div>
  <div style="margin-top:14px">
    <label for="notes-field">Заметки приёмщика</label>
    <textarea id="notes-field" placeholder="Комплектность, отсутствующие узлы, следы ДТП"></textarea>
  </div>
</section>

<!-- Фото --------------------------------------------------------->
<section class="panel">
  <p class="eyebrow">Фото осмотра</p>
  <div class="files" id="dropzone">Снять или выбрать фото — четыре угла, салон, подкапотное</div>
  <input type="file" id="photos" accept="image/*" multiple capture="environment" hidden>
  <div class="thumbs" id="thumbs"></div>
</section>

<div class="bar">
  <button class="primary" id="save" disabled>Принять автомобиль</button>
  <button class="ghost" id="reset">Очистить</button>
  <span class="status" id="status"></span>
</div>

</div>

{% include "admin/_quickadd.html" %}

<script>
const $ = id => document.getElementById(id);
const SEGMENTS = ['wmi','wmi','wmi','vds','vds','vds','vds','vds','chk','yr','ser','ser','ser','ser','ser','ser','ser'];
let decoded = null, checkOk = true;

// --- линейка -------------------------------------------------------
const ruler = $('ruler');
SEGMENTS.forEach((seg, i) => {
  const c = document.createElement('div');
  c.className = `cell seg-${seg}`;
  c.textContent = i + 1;
  ruler.appendChild(c);
});

function paintRuler(vin){
  [...ruler.children].forEach((c, i) => {
    const ch = vin[i];
    c.classList.toggle('filled', !!ch);
    c.classList.toggle('bad', i === 8 && !!ch && !checkOk);
    c.textContent = ch || (i + 1);
  });
}

// --- ввод VIN ------------------------------------------------------
let timer;
$('vin').addEventListener('input', e => {
  const v = e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
  e.target.value = v;
  paintRuler(v);
  clearTimeout(timer);
  $('vin').classList.toggle('bad', v.length === 17 && !checkOk);
  if (v.length === 17) timer = setTimeout(() => decodeVin(v), 250);
  else { $('readout').innerHTML = ''; $('notes').innerHTML = ''; decoded = null; }
  refreshSave();
});

async function decodeVin(vin){
  $('status').textContent = 'Разбираю номер…';
  try {
    const r = await fetch('/api/vin/decode', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vin})
    });
    const d = await r.json();
    $('status').textContent = '';
    render(d);
  } catch (err) {
    $('status').textContent = '';
    $('notes').innerHTML = note('err', 'Сервер не ответил. Данные можно ввести вручную.');
  }
}

const note = (kind, text) => `<div class="note ${kind}">${text}</div>`;

function render(d){
  decoded = d;
  checkOk = d.valid;
  paintRuler($('vin').value);
  $('vin').classList.toggle('bad', !d.valid);

  if (!d.valid){
    $('readout').innerHTML = '';
    $('notes').innerHTML = d.errors.map(e => note('err', e)).join('');
    refreshSave();
    return;
  }

  const cell = (label, value, mono) =>
    `<div><dt>${label}</dt><dd class="${mono?'mono':''}">${value ?? '—'}</dd></div>`;

  $('readout').innerHTML = '<dl class="readout">' +
    cell('Страна', d.country) +
    cell('Завод', d.manufacturer || `WMI ${d.wmi} неизвестен`) +
    cell('Год', d.year) +
    cell('Код модели', d.vds, true) +
    cell('Номер кузова', d.serial, true) +
    '</dl>';

  let n = '';
  if (d.duplicate)
    n += note('err', `Этот VIN уже принят — донор ${d.duplicate.code}, статус «${d.duplicate.status}».`);
  if (d.chain)
    n += note('ok', `Определено по прошлым машинам: ${d.chain.brand} ${d.chain.model} ${d.chain.generation}, ${d.chain.modification}. Проверьте и поправьте, если не сходится.`);
  n += (d.warnings || []).map(w => note('warn', w)).join('');
  $('notes').innerHTML = n;

  if (d.year && !$('year').value) $('year').value = d.year;
  if (d.chain) applyChain(d.chain);
  refreshSave();
}

// --- каскад справочников -------------------------------------------
async function fill(sel, url, format, keep){
  const el = $(sel);
  el.innerHTML = '<option value="">—</option>';
  el.disabled = true;
  if (!url) return;
  const rows = await (await fetch(url)).json();
  rows.forEach(r => {
    const o = document.createElement('option');
    o.value = r.id;
    o.textContent = format(r);
    el.appendChild(o);
  });
  el.disabled = false;
  if (keep) el.value = keep;
}

const fmtGen = g => `${g.name}${g.body_type ? ', ' + g.body_type : ''} (${g.year_from}–${g.year_to || 'н.в.'})`;
const fmtMod = m => [m.engine_volume && m.engine_volume + ' л', m.engine_code, m.power_hp && m.power_hp + ' л.с.', m.transmission, m.drive, m.doors && m.doors + ' дв.'].filter(Boolean).join(' · ');

// Комплектации есть далеко не у всех модификаций: если справочник пуст,
// поле не показываем, чтобы не мозолило глаза пустым списком
async function loadComplectations(modificationId){
  const box = $('complectationBox');
  if (!modificationId){ box.hidden = true; $('complectation').innerHTML = ''; return; }
  await fill('complectation', `/api/complectations?modification_id=${modificationId}`, r => r.name);
  box.hidden = $('complectation').options.length <= 1;
}

async function applyChain(c){
  await fill('model', `/api/models?brand_id=${c.brand_id}`, r => r.name, c.model_id);
  await fill('generation', `/api/generations?model_id=${c.model_id}`, fmtGen, c.generation_id);
  await fill('modification', `/api/modifications?generation_id=${c.generation_id}`, fmtMod, c.modification_id);
  $('brand').value = c.brand_id;
  ['brand','model','generation','modification'].forEach(id => $(id).classList.add('auto'));
  await loadComplectations(c.modification_id);
  refreshSave();
}

$('brand').addEventListener('change', async e => {
  clearAuto();
  await fill('model', e.target.value ? `/api/models?brand_id=${e.target.value}` : null, r => r.name);
  await fill('generation', null); await fill('modification', null);
  await loadComplectations(null);
  refreshSave();
});
$('model').addEventListener('change', async e => {
  clearAuto();
  await fill('generation', e.target.value ? `/api/generations?model_id=${e.target.value}` : null, fmtGen);
  await fill('modification', null);
  await loadComplectations(null);
  refreshSave();
});
$('generation').addEventListener('change', async e => {
  clearAuto();
  await fill('modification', e.target.value ? `/api/modifications?generation_id=${e.target.value}` : null, fmtMod);
  await loadComplectations(null);
  refreshSave();
});
$('modification').addEventListener('change', async e => {
  await loadComplectations(e.target.value || null);
  refreshSave();
});

const clearAuto = () => ['brand','model','generation','modification']
  .forEach(id => $(id).classList.remove('auto'));

// --- фото ----------------------------------------------------------
let files = [];
$('dropzone').addEventListener('click', () => $('photos').click());
$('photos').addEventListener('change', async e => {
  // Снимки осмотра тоже квадратные: одна логика на все формы
  files = [];
  for (const f of e.target.files){
    const blob = await cropImage(f);
    if (blob) files.push(new File([blob], 'photo.jpg', {type:'image/jpeg'}));
  }
  $('thumbs').innerHTML = '';
  files.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = () => URL.revokeObjectURL(img.src);
    $('thumbs').appendChild(img);
  });
  $('dropzone').textContent = files.length ? `Выбрано фото: ${files.length}` : 'Снять или выбрать фото';
});

// --- сохранение ------------------------------------------------------
$('noVin').addEventListener('change', e => {
  $('vin').disabled = e.target.checked;
  if (e.target.checked){ $('vin').value=''; paintRuler(''); $('readout').innerHTML=''; $('notes').innerHTML=''; decoded=null; }
  refreshSave();
});

// Кнопка молча гасла, и приёмщик не понимал, чего от него хотят.
// Подсвечиваем незаполненное и пишем прямо на кнопке, что осталось
function refreshSave(){
  const vinOk = $('noVin').checked || (decoded && decoded.valid);
  const genOk = !!$('generation').value;
  const modOk = !!$('modification').value;

  $('vin').classList.toggle('need', !vinOk);
  $('needVin').hidden = vinOk;
  $('generation').classList.toggle('need', !genOk);
  $('needGen').hidden = genOk;
  // Модификация обязательна: в справочнике она есть у каждого поколения
  $('modification').classList.toggle('need', genOk && !modOk);
  $('needMod').hidden = !(genOk && !modOk);

  $('save').disabled = !(vinOk && genOk && modOk);
  if (!vinOk)       $('save').textContent = 'Введите VIN или отметьте, что его нет';
  else if (!genOk)  $('save').textContent = 'Выберите модель и поколение';
  else if (!modOk)  $('save').textContent = 'Выберите модификацию';
  else              $('save').textContent = 'Принять автомобиль';
}

$('save').addEventListener('click', async () => {
  $('save').disabled = true;
  $('status').textContent = 'Сохраняю…';
  const body = {
    vin: $('noVin').checked ? null : $('vin').value,
    generation_id: +$('generation').value,
    modification_id: $('modification').value ? +$('modification').value : null,
    complectation_id: $('complectation').value ? +$('complectation').value : null,
    year: $('year').value ? +$('year').value : null,
    color: $('color').value || null,
    mileage_km: $('mileage').value ? +$('mileage').value : null,
    plate: $('plate').value || null,
    purchase_price: $('price').value ? +$('price').value : null,
    accepted_at: $('acceptedAt').value || null,
    notes: $('notes-field').value || null
  };
  // Приёмка машины и загрузка фото разнесены намеренно: раньше всё
  // лежало в одном try, и любая ошибка после успешного сохранения
  // (в том числе опечатка в коде страницы) показывалась приёмщику как
  // «нет связи». Машина при этом была принята, он жал «Сохранить»
  // повторно и получал «VIN уже принят».
  let donor;
  try {
    const r = await fetch('/api/donors', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (!r.ok){
      const err = await r.json().catch(() => ({}));
      $('status').textContent = '';
      $('notes').innerHTML = note('err', err.detail || 'Сохранить не удалось');
      $('save').disabled = false;
      return;
    }
    donor = await r.json();
  } catch (e) {
    console.error('Приёмка не удалась:', e);
    $('status').textContent = '';
    $('notes').innerHTML = note('err', 'Нет связи с сервером. Не закрывайте вкладку.');
    $('save').disabled = false;
    return;
  }

  // Дальше машина уже в базе — что бы ни случилось, это не обрыв связи
  if (files.length){
    $('status').textContent = 'Загружаю фото…';
    try {
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));
      const pr = await fetch(`/api/donors/${donor.id}/photos`, {method:'POST', body: fd});
      if (!pr.ok) throw new Error(`HTTP ${pr.status}`);
    } catch (e) {
      console.error('Фото не загрузились:', e);
      $('notes').innerHTML = note('warn',
        `${donor.code} принят, но фото не загрузились. Добавьте их позже из карточки машины.`);
    }
  }

  $('status').textContent = `Принят: ${donor.code}. Можно вводить следующий.`;
  resetForm();
});

function resetForm(){
  $('vin').value = ''; $('vin').disabled = false; $('noVin').checked = false;
  paintRuler(''); $('readout').innerHTML = ''; $('notes').innerHTML = '';
  // Дату приёмки намеренно не сбрасываем: партию машин заводят одним
  // заходом и обычно одной датой
  ['year','color','mileage','plate','price','notes-field'].forEach(id => $(id).value = '');
  ['model','generation','modification'].forEach(id => { $(id).innerHTML=''; $(id).disabled = true; });
  $('complectation').innerHTML = ''; $('complectationBox').hidden = true;
  $('brand').value = ''; clearAuto();
  files = []; $('photos').value = ''; $('thumbs').innerHTML = '';
  $('dropzone').textContent = 'Снять или выбрать фото — четыре угла, салон, подкапотное';
  decoded = null; refreshSave(); $('vin').focus();
}

$('reset').addEventListener('click', resetForm);

// --- старт ---------------------------------------------------------
paintRuler('');
// Будущей датой машину принять нельзя — верхняя граница всегда сегодня
$('acceptedAt').max = new Date().toISOString().slice(0, 10);

fill('brand', '/api/brands', r => r.name);
$('vin').focus();
</script>
{% include "admin/_cropper.html" %}
</body>
</html>
