{#
  Подключается в intake.html:
      {% include "admin/_quickadd.html" %}

  Даёт приёмщику кнопку «Нет в списке» рядом с каждым селектом.
  Открывается модалка, поле заполняется, селект обновляется — машина
  принимается без ожидания менеджера.
#}

<link rel="stylesheet" href="{{ asset('css/admin/quickadd.css') }}">

<dialog class="qa" id="qaModal">
  <div class="head">
    <h3 id="qaTitle">Новая запись</h3>
    <p class="ctx" id="qaCtx"></p>
  </div>

  <div class="in">
    <div class="field">
      <label for="qaName" id="qaNameLabel">Название</label>
      <input type="text" id="qaName" autocomplete="off" spellcheck="false">
    </div>

    <div id="qaGenFields" hidden>
      <div class="field">
        <label for="qaBody">Тип кузова</label>
        <select id="qaBody"><option value="">—</option></select>
      </div>
      <div class="row">
        <div>
          <label for="qaFrom">Год начала выпуска</label>
          <input type="number" id="qaFrom" min="1950" max="2035" inputmode="numeric">
        </div>
        <div>
          <label for="qaTo">Год окончания</label>
          <input type="number" id="qaTo" min="1950" max="2035" inputmode="numeric"
                 placeholder="пусто = выпускается">
        </div>
      </div>
    </div>

    <div class="warn" id="qaWarn"></div>
  </div>

  <div class="foot">
    <button class="ok" id="qaSave" disabled>Добавить</button>
    <button class="no" id="qaCancel">Отмена</button>
  </div>
</dialog>

<script src="{{ asset('js/admin/quickadd.js') }}"></script>
