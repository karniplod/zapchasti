<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разбор {{ donor.code }}</title>
<style>
:root{
  --bg:#12161c; --panel:#181d25; --panel-2:#1f2630; --line:#2b333f;
  --ink:#e8ecf2; --muted:#8794a6; --dim:#5c6878;
  --amber:#ffc233; --ok:#4cc38a; --warn:#ff9f2e; --err:#ff5f56;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}

/* Шапка: разборщик всегда должен видеть, какую машину он режет */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
     border-bottom:1px solid var(--line);padding:14px 0 12px;margin-bottom:18px}
.top .car{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top .code{font-family:var(--mono);color:var(--amber);font-size:15px;font-weight:600}
.top h1{margin:0;font-size:17px;font-weight:600}
.top .meta{font-size:13px;color:var(--muted)}
.counter{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}

.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--dim);font-weight:600;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:18px;margin-bottom:16px}

input,select,textarea,button{font-family:inherit;font-size:16px}
input[type=text],input[type=number],textarea{width:100%;background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:12px;outline:none}
input:focus,textarea:focus{border-color:var(--amber)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Поиск категории */
.results{margin-top:8px;max-height:230px;overflow-y:auto;
         border:1px solid var(--line);border-radius:9px;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:12px 14px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.sel{background:var(--panel-2)}
.results .path{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.picked{display:flex;align-items:center;gap:10px;background:var(--panel-2);
  border:1px solid rgba(255,194,51,.4);border-radius:9px;padding:12px 14px}
.picked .path{font-size:12px;color:var(--muted)}
.picked button{margin-left:auto;background:none;border:0;color:var(--dim);
  font-size:20px;cursor:pointer;padding:0 4px}

/* Состояние — четыре крупные кнопки, нажимаются в перчатках */
.cond{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cond button{padding:14px 0;border-radius:10px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;line-height:1.2}
.cond button b{display:block;font-size:20px;font-weight:700;margin-bottom:2px}
.cond button small{font-size:10px;letter-spacing:.03em}
.cond button.on{background:rgba(255,194,51,.14);border-color:var(--amber);color:var(--ink)}

/* Фото */
.shoot{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:26px;border:1px dashed var(--line);border-radius:10px;background:transparent;
  color:var(--muted);cursor:pointer}
.shoot:hover{border-color:var(--amber);color:var(--ink)}
.shoot.empty-warn{border-color:rgba(255,159,46,.5)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--err);color:#fff;border:0;font-size:14px;line-height:1;cursor:pointer}

/* Список добавленного */
.part{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.part img,.part .noimg{width:52px;height:52px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);flex:0 0 52px}
.part .noimg{display:flex;align-items:center;justify-content:center;
  background:var(--panel-2);color:var(--warn);font-size:11px;text-align:center}
.part .info{min-width:0;flex:1}
.part .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part .sub{font-size:12px;color:var(--dim);font-family:var(--mono)}
.part .pr{font-family:var(--mono);font-size:14px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;
     background:var(--panel-2);color:var(--muted);margin-left:6px}
.tag.draft{background:rgba(255,159,46,.15);color:var(--warn)}
.part .del{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:6px}

/* Нижняя панель */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
     border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
     display:flex;gap:10px;align-items:center}
.bar .inner{max-width:760px;margin:0 auto;display:flex;gap:10px;width:100%;align-items:center}
button.primary{background:var(--amber);color:#1a1408;border:0;border-radius:10px;
  padding:14px 20px;font-weight:600;cursor:pointer;flex:1}
button.primary:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:12px 18px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{border-color:rgba(76,195,138,.5)}
.toast.err{border-color:rgba(255,95,86,.5);color:#ff9a94}
</style>
</head>
<body>

<div class="wrap">

<div class="top">
  <div class="car">
    <span class="code">{{ donor.code }}</span>
    <h1>{{ donor.brand }} {{ donor.model }}</h1>
    <span class="meta">
      {{ donor.generation }}{% if donor.body_type %}, {{ donor.body_type }}{% endif %}
      {% if donor.year %} · {{ donor.year }}{% endif %}
      {% if donor.color %} · {{ donor.color }}{% endif %}
    </span>
    <span class="counter" id="counter">{{ donor.parts_count }} дет.</span>
  </div>
</div>

<!-- Добавление детали ------------------------------------------->
<section class="panel">
  <p class="eyebrow">Новая деталь</p>

  <button type="button" class="shoot" id="shoot">📷 Снять деталь</button>
  <input type="file" id="photos" accept="image/*" multiple capture="environment" hidden>
  <div class="thumbs" id="thumbs"></div>

  <div id="catBox" style="margin-top:18px">
    <label for="catSearch">Что это за деталь</label>
    <input type="text" id="catSearch" placeholder="дверь пер, фара, стойка…"
           autocomplete="off" spellcheck="false">
    <div class="results" id="catResults"></div>
  </div>
  <div class="picked" id="catPicked" hidden>
    <div style="min-width:0">
      <div id="pickedName"></div>
      <div class="path" id="pickedPath"></div>
    </div>
    <button type="button" id="catClear" aria-label="Выбрать другую категорию">×</button>
  </div>

  <div style="margin-top:18px">
    <label>Состояние</label>
    <div class="cond" id="cond">
      <button type="button" data-c="A"><b>A</b><small>отличное</small></button>
      <button type="button" data-c="B"><b>B</b><small>рабочее</small></button>
      <button type="button" data-c="C"><b>C</b><small>с дефектом</small></button>
      <button type="button" data-c="D"><b>D</b><small>под ремонт</small></button>
    </div>
  </div>

  <div style="margin-top:18px">
    <label for="price">Цена, ₽</label>
    <input type="number" id="price" min="0" step="50" inputmode="numeric">
  </div>

  <button type="button" id="moreBtn" style="margin-top:16px;background:none;
    border:0;color:var(--amber);text-decoration:underline;font-size:14px;
    cursor:pointer;padding:0;font-family:inherit">Ещё поля</button>

  <div id="more" hidden>
    <div style="margin-top:14px">
      <label for="name">Название в каталоге</label>
      <input type="text" id="name" placeholder="по умолчанию — название узла">
    </div>
    <div style="margin-top:14px">
      <label for="oem">Каталожный номер</label>
      <input type="text" id="oem" autocomplete="off">
    </div>
    <div style="margin-top:14px">
      <label for="note">Дефекты</label>
      <input type="text" id="note" placeholder="скол на кромке 2 см">
    </div>
    <div class="row" style="margin-top:14px">
      <div><label for="loc">Место хранения</label>
        <input type="text" id="loc" placeholder="стеллаж Б-3" autocomplete="off"></div>
      <div><label for="weight">Вес, кг</label>
        <input type="number" id="weight" min="0" step="0.5" inputmode="decimal"></div>
    </div>
  </div>
</section>

<!-- Список ------------------------------------------------------>
<section class="panel">
  <p class="eyebrow">Снято с машины</p>
  <div id="list"></div>
</section>

</div>

<div class="bar">
  <div class="inner">
    <button class="primary" id="save" disabled>Добавить деталь</button>
    <button class="ghost" id="labels">Этикетки</button>
    <button class="ghost" id="finish">Закрыть разбор</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DONOR_ID = {{ donor.id }};
const $ = id => document.getElementById(id);

let category = null, condition = null, files = [], lastLoc = '';

// --- поиск категории -------------------------------------------------
let searchTimer;
$('catSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => searchCats(q), 200);
});
$('catSearch').addEventListener('focus', () => searchCats($('catSearch').value.trim()));

async function searchCats(q){
  const rows = await (await fetch('/api/part-categories' + (q ? `?q=${encodeURIComponent(q)}` : ''))).json();
  const box = $('catResults');
  box.innerHTML = '';
  rows.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `${r.name}<span class="path">${r.path}</span>`;
    b.onclick = () => pick(r);
    box.appendChild(b);
  });
  box.classList.toggle('open', rows.length > 0);
}

function pick(r){
  category = r;
  $('catBox').hidden = true;
  $('catPicked').hidden = false;
  $('pickedName').textContent = r.name;
  $('pickedPath').textContent = r.path;
  if (!$('name').value) $('name').value = r.name;
  $('catResults').classList.remove('open');
  refresh();
}

$('catClear').onclick = () => {
  category = null;
  $('catBox').hidden = false;
  $('catPicked').hidden = true;
  $('catSearch').value = '';
  $('catSearch').focus();
  refresh();
};

// --- состояние -------------------------------------------------------
$('cond').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  condition = b.dataset.c;
  [...$('cond').children].forEach(x => x.classList.toggle('on', x === b));
  refresh();
});

// --- фото ------------------------------------------------------------
$('shoot').onclick = () => $('photos').click();
$('photos').addEventListener('change', e => {
  files = files.concat([...e.target.files]);
  e.target.value = '';
  drawThumbs();
  refresh();
});

function drawThumbs(){
  const box = $('thumbs');
  box.innerHTML = '';
  files.forEach((f, i) => {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = () => URL.revokeObjectURL(img.src);
    const del = document.createElement('button');
    del.textContent = '×';
    del.setAttribute('aria-label', 'Убрать фото');
    del.onclick = () => { files.splice(i, 1); drawThumbs(); refresh(); };
    fig.append(img, del);
    box.appendChild(fig);
  });
  $('shoot').textContent = files.length ? `Добавить ещё фото (${files.length})` : 'Снять деталь';
  $('shoot').classList.toggle('empty-warn', files.length === 0);
}

// --- сохранение ------------------------------------------------------
function refresh(){
  $('save').disabled = !(category && condition);
  if (!category)        $('save').textContent = 'Выберите деталь';
  else if (!condition)  $('save').textContent = 'Укажите состояние';
  else if (!files.length) $('save').textContent = 'Добавить без фото (черновик)';
  else                  $('save').textContent = 'Добавить деталь';
}
$('name').addEventListener('input', refresh);

$('save').onclick = async () => {
  $('save').disabled = true;
  const fd = new FormData();
  fd.append('donor_id', DONOR_ID);
  fd.append('category_id', category.id);
  fd.append('name', $('name').value.trim() || category.name);
  fd.append('condition', condition);
  ['oem','price','loc','weight'].forEach(id => {
    const map = {oem:'oem_number', price:'price', loc:'location', weight:'weight_kg'};
    if ($(id).value) fd.append(map[id], $(id).value);
  });
  if ($('note').value) fd.append('condition_note', $('note').value);
  files.forEach(f => fd.append('files', f));

  try {
    const r = await fetch('/api/parts', {method:'POST', body: fd});
    if (!r.ok){
      const e = await r.json().catch(() => ({}));
      toast(e.detail || 'Сохранить не удалось', 'err');
      $('save').disabled = false;
      return;
    }
    const p = await r.json();
    let msg = p.sku;
    if (p.status === 'draft') msg += ' — черновик, нужно фото';
    else if (p.applicability_rows) msg += ` — применимость: ${p.applicability_rows} модиф.`;
    toast(msg, p.status === 'draft' ? '' : 'ok');
    clearForm();
    loadParts();
  } catch {
    toast('Нет связи. Не закрывайте страницу', 'err');
    $('save').disabled = false;
  }
};

function clearForm(){
  // Место хранения и состояние не сбрасываем: подряд снимают
  // однотипные детали и кладут на ту же полку
  lastLoc = $('loc').value;
  ['name','oem','price','note','weight'].forEach(id => $(id).value = '');
  category = null;
  $('catBox').hidden = false; $('catPicked').hidden = true;
  $('catSearch').value = '';
  files = []; drawThumbs();
  $('loc').value = lastLoc;
  refresh();
  $('catSearch').focus();
  window.scrollTo({top:0, behavior:'smooth'});
}

// --- список ----------------------------------------------------------
async function loadParts(){
  const rows = await (await fetch(`/api/donors/${DONOR_ID}/parts`)).json();
  $('counter').textContent = `${rows.length} дет.`;
  const list = $('list');
  if (!rows.length){
    list.innerHTML = '<p style="color:var(--dim);font-size:14px;margin:0">Пока пусто. Первая снятая деталь появится здесь.</p>';
    return;
  }
  list.innerHTML = '';
  rows.forEach(p => {
    const el = document.createElement('div');
    el.className = 'part';
    el.innerHTML = `
      ${p.photo ? `<img src="${p.photo}" alt="">` : '<div class="noimg">нет фото</div>'}
      <div class="info">
        <div class="nm">${p.name}
          ${p.status === 'draft' ? '<span class="tag draft">черновик</span>' : ''}
          <span class="tag">${p.condition}</span>
        </div>
        <div class="sub">${p.sku}${p.location ? ' · ' + p.location : ''}</div>
      </div>
      <div class="pr">${p.price ? Number(p.price).toLocaleString('ru') + ' ₽' : '—'}</div>
      <button class="del" aria-label="Удалить деталь">×</button>`;
    el.querySelector('.del').onclick = async () => {
      if (!confirm(`Удалить ${p.sku}?`)) return;
      const r = await fetch(`/api/parts/${p.id}`, {method:'DELETE'});
      if (r.ok) loadParts();
      else toast((await r.json()).detail, 'err');
    };
    list.appendChild(el);
  });
}

// --- нижние кнопки ---------------------------------------------------
$('labels').onclick = () => window.open(`/donors/${DONOR_ID}/labels`, '_blank');

$('finish').onclick = async () => {
  if (!confirm('Закрыть разбор? Машина уйдёт в статус «разобрана».')) return;
  const r = await fetch(`/api/donors/${DONOR_ID}/finish`, {method:'POST'});
  const d = await r.json();
  if (!r.ok) toast(d.detail, 'err');
  else { toast('Разбор закрыт', 'ok'); setTimeout(() => location.href = '/admin', 900); }
};

// --- прочее ----------------------------------------------------------
let toastTimer;
function toast(msg, kind = ''){
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2600);
}

document.addEventListener('click', e => {
  if (!e.target.closest('#catBox')) $('catResults').classList.remove('open');
});

$('moreBtn').onclick = () => {
  const m = $('more');
  m.hidden = !m.hidden;
  $('moreBtn').textContent = m.hidden ? 'Ещё поля' : 'Скрыть';
};

drawThumbs();
loadParts();
</script>
</body>
</html>
