<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — {{ app_name }}</title>
<style>
:root{
  --bg:#12161c; --panel:#181d25; --panel-2:#1f2630; --line:#2b333f;
  --ink:#e8ecf2; --muted:#8794a6; --amber:#ffc233; --err:#ff5f56;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:360px}
h1{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--amber)}
p.sub{margin:0 0 26px;font-size:13px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus{border-color:var(--amber)}
.field{margin-bottom:16px}
button{width:100%;background:var(--amber);color:#1a1408;border:0;border-radius:9px;
  padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.err{background:rgba(255,95,86,.1);border:1px solid rgba(255,95,86,.3);color:#ff9a94;
  border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:18px}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <h1>РАЗБОР<span>·</span>ПАРТС</h1>
  <p class="sub">Вход для сотрудников</p>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <input type="hidden" name="next" value="{{ next }}">

  <div class="field">
    <label for="login">Логин</label>
    <input type="text" id="login" name="login" autocomplete="username"
           autocapitalize="none" spellcheck="false" required autofocus>
  </div>

  <div class="field">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>
  </div>

  <button type="submit">Войти</button>
</form>
</body>
</html>
