<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказы</title>
<link rel="stylesheet" href="/static/admin.css?v={{ admin_css_version() }}">
{# Длинные списки (марки, модели, категории) получают поиск;
   без скрипта остаются обычными системными списками #}
<link rel="stylesheet" href="{{ asset('css/combo.css') }}">
<script defer src="{{ asset('js/combo.js') }}"></script>
<link rel="stylesheet" href="{{ asset('css/admin/orders.css') }}"></head><body>

{% include "admin/_nav.html" %}

<div class="wrap">
  <div class="tabs" id="mode">
    <button class="on" data-m="orders">Заказы</button>
    <button data-m="leads">Заявки</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="on" data-s="">Все</button>
    <button data-s="new">Новые</button>
    <button data-s="confirmed">Подтверждённые</button>
    <button data-s="paid">Оплаченные</button>
    <button data-s="completed">Выданные</button>
  </div>
  {# Филиал собирает свои посылки — ему нужны только заказы, где они есть #}
  {% if user.branch_id %}
  <label class="mine-only"><input type="checkbox" id="mine"> Только заказы с посылками моего филиала</label>
  {% endif %}
  <div id="list" data-branch="{{ user.branch_id or '' }}"><p class="blank">Загружаю…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ asset('js/admin/orders.js') }}"></script>
</body></html>
