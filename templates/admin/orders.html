<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказы</title>
<link rel="stylesheet" href="/static/admin.css?v={{ admin_css_version() }}">
<style>
.ord{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin-bottom:10px}
.ord .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ord .num{font-family:var(--mono);color:var(--amber);font-size:14px;font-weight:600}
.ord .who{font-size:14.5px}
.ord .who small{color:var(--dim);display:block;font-size:12px}
.ord .total{margin-left:auto;font-size:15px;font-variant-numeric:tabular-nums}
.ord .st{font-size:11px;padding:3px 9px;border-radius:5px;
  background:var(--panel-2);color:var(--muted)}
.ord .st.paid{background:rgba(76,195,138,.15);color:var(--ok)}
.ord .st.new{background:rgba(255,194,51,.15);color:var(--amber)}
.ord .st.cancelled{color:var(--err)}
.ord .meta{font-size:13px;color:var(--dim);margin-top:5px}

.lines{list-style:none;margin:11px 0 0;padding:0;display:grid;gap:6px}
.lines li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;
  padding:7px 0;border-top:1px solid var(--line)}
.lines .sku{font-family:var(--mono);font-size:12px;color:var(--dim);flex:0 0 108px}
.lines .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines .pr{font-variant-numeric:tabular-nums}
.lines .where{color:var(--dim);font-size:12px}

.ord select{padding:8px 10px;font-size:13.5px}
</style></head><body>

{% include "admin/_nav.html" %}

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="on" data-s="">Все</button>
    <button data-s="new">Новые</button>
    <button data-s="confirmed">Подтверждённые</button>
    <button data-s="paid">Оплаченные</button>
    <button data-s="completed">Выданные</button>
  </div>
  <div id="list"><p class="blank">Загружаю…</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let status = '';

const STATUSES = {new:'новый', confirmed:'подтверждён', paid:'оплачен',
                  shipped:'отправлен', completed:'выдан', cancelled:'отменён'};

const money = v => v ? Number(v).toLocaleString('ru') + ' ₽' : '—';
const when = s => new Date(s).toLocaleDateString('ru');

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  status = b.dataset.s;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  load();
};

async function load(){
  const rows = await (await fetch('/api/manage/orders' + (status ? `?status=${status}` : ''))).json();
  if (!rows.length){ $('list').innerHTML = '<p class="blank">Заказов нет</p>'; return; }

  $('list').innerHTML = rows.map(o => `
    <div class="ord" data-id="${o.id}">
      <div class="h">
        <span class="num">№ ${o.number}</span>
        <span class="who">${o.customer_name || 'без имени'}
          <small>${o.phone || ''}</small></span>
        <span class="st ${o.status}">${STATUSES[o.status] || o.status}</span>
        <span class="total">${money(o.total)}</span>
      </div>
      <div class="meta">${when(o.created_at)} ·
        ${o.delivery_method === 'shipping'
          ? 'доставка' + (o.delivery_address ? ': ' + o.delivery_address : '')
          : 'самовывоз'}${o.paid_at ? ' · оплачен ' + when(o.paid_at) : ''}
        ${o.comment ? ' · ' + o.comment : ''}</div>

      <ul class="lines">
        ${o.items.map(i => `<li>
          <span class="sku">${i.sku}</span>
          <span class="nm">${i.name}</span>
          <span class="where">${i.branch || ''}</span>
          <span class="pr">${money(i.price)}</span>
        </li>`).join('')}
      </ul>

      <div class="actions-row">
        <select class="f-status">
          ${Object.entries(STATUSES).map(([k, v]) =>
            `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
        <button class="btn btn-accent save">Сохранить</button>
      </div>
    </div>`).join('');

  document.querySelectorAll('.ord').forEach(el => {
    el.querySelector('.save').onclick = () => save(el);
  });
}

// Оплату отмечает менеджер: онлайн-оплаты нет, деньги приходят
// при получении. Отмена возвращает детали на витрину — это делает сервер
async function save(el){
  const btn = el.querySelector('.save');
  btn.disabled = true;
  try {
    const r = await fetch(`/api/manage/orders/${el.dataset.id}`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: el.querySelector('.f-status').value})});
    if (!r.ok){
      const d = await r.json().catch(() => ({}));
      toast(d.detail || 'Не удалось сохранить', 'err');
      btn.disabled = false; return;
    }
    toast('Сохранено', 'ok');
    load();
  } catch { toast('Нет связи с сервером', 'err'); btn.disabled = false; }
}

let tt;
function toast(m, k=''){ const el = $('toast'); el.textContent = m;
  el.className = `toast show ${k}`;
  clearTimeout(tt); tt = setTimeout(() => el.className = 'toast', 2400); }

load();
</script>
</body></html>
