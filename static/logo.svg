<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Знак собран в манере образца витрины: контур одной толщиной,
       скруглённые концы, оранжевый, «линии скорости» слева. Машина —
       чем занимаемся, сердце — донорство: с одной машины детали уходят
       в десяток других. Сердце бьётся «тук-тук», как в кардиограмме:
       сильный толчок, через миг второй слабее, потом пауза. Анимация
       живёт внутри файла, поэтому работает и когда знак вставлен
       картинкой. Машина при этом неподвижна — прыгающий логотип
       в шапке раздражает. -->
  <style>
    .heart{transform-box:fill-box;transform-origin:50% 50%;
           animation:beat 1s ease-in-out infinite}
    @keyframes beat{
      0%{transform:scale(1)} 8%{transform:scale(1.14)}
      16%{transform:scale(1.02)} 24%{transform:scale(1.09)}
      34%{transform:scale(1)} 100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.heart{animation:none}}
  </style>
  <!-- кузов: капот, крыша, корма -->
  <path d="M10 31.5V27.4l4.2-7.6a2.6 2.6 0 0 1 2.3-1.4h12.9a2.6 2.6 0 0 1 2 1l4.6 7.9
           2.6.6a2.6 2.6 0 0 1 2 2.5v1.1"/>
  <!-- днище с проёмами под колёса и сами арки -->
  <path d="M10 31.5h1.2M18.6 31.5h12.1M38.1 31.5h1.5"/>
  <path d="M11.2 31.5a3.7 3.7 0 0 1 7.4 0M30.7 31.5a3.7 3.7 0 0 1 7.4 0"/>
  <!-- линии скорости -->
  <path d="M1.5 21h5.5M2.5 31h4"/>
  <path class="heart" d="M8.4 9.6a2.9 2.9 0 0 0-4.6 3.3c.8 1.6 3.3 3.4 4.6 4.2
           1.3-.8 3.8-2.6 4.6-4.2a2.9 2.9 0 0 0-4.6-3.3z"/>
</svg>
