<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.6 -1.2 48.2 44.7" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="3.0"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Мультяшное сердце, разрезанное пополам линией сердечного ритма.
       Слева живая половина, справа механическая: по её контуру идут
       зубцы, как по краю шестерни. Смысл прямой — с одной машины детали
       уходят в другие, «живое» становится запчастями.

       Зубцы врезаны в контур, а не наклеены поверх: путь заходит в
       каждый зуб и возвращается. Иначе в контурном рисунке видно
       перечёркнутое основание зуба. Нормаль берётся из производной
       кривой, места зубцов считаются по длине дуги — поэтому они
       одинаковые и контур не рвётся.

       Линия ритма — прямая с одним коротким всплеском. Длинный зигзаг
       читался трещиной, то есть «разбитым сердцем». -->
  <style>
    .beat{transform-box:fill-box;transform-origin:50% 50%;
          animation:beat 1s ease-in-out infinite}
    @keyframes beat{
      0%{transform:scale(1)} 8%{transform:scale(1.05)}
      16%{transform:scale(1.01)} 24%{transform:scale(1.035)}
      34%{transform:scale(1)} 100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.beat{animation:none}}
  </style>
