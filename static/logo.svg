<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6.6 40.6 35.4" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="2.8"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Знак собран из трёх вещей: сердце — донорство (с одной машины
       детали уходят в десяток других), шестерёнка — что именно мы
       снимаем, кардиограмма внутри — что машина ещё «живая», пока с неё
       есть что взять.

       Почему не строго «половина сердца, половина шестерёнки»: пробовали,
       зубцы в 24 px превращаются в колючки, а силуэт читается как ягода.
       Сердце целое, шестерёнка отдельная — в мелком размере оба знака
       остаются узнаваемыми.

       Бьётся только сердце с кардиограммой, шестерёнка стоит: крутящаяся
       шестерёнка в шапке отвлекает от страницы. Анимация внутри файла,
       поэтому работает и когда знак вставлен картинкой. -->
  <style>
    .beat{transform-box:fill-box;transform-origin:50% 50%;
          animation:beat 1s ease-in-out infinite}
    @keyframes beat{
      0%{transform:scale(1)} 8%{transform:scale(1.07)}
      16%{transform:scale(1.01)} 24%{transform:scale(1.045)}
      34%{transform:scale(1)} 100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.beat{animation:none}}
  </style>

  <g class="beat">
    <!-- сердце: левая доля, низ и правая доля, обрезанная шестерёнкой -->
    <path d="M22 40C11.5 32.6 5 26.4 5 19.6A7.9 7.9 0 0 1 22 15.6 7.9 7.9 0 0 1 36 17"/>
    <path d="M36 24.6c0 4.2-5 9.2-14 15.4"/>
    <!-- кардиограмма -->
    <path d="M8 26h5.5l2.6-5.4 4 10.4 2.8-6.2 1.9 3.6h4.4"/>
  </g>

  <!-- шестерёнка -->
  <circle cx="38.5" cy="12.5" r="5.2"/>
  <path d="M38.5 5.3v1.9M38.5 17.8v1.9M44.8 8.9l-1.6 1M33.8 15.1l-1.6 1M44.8 16.1l-1.6-1M33.8 9.9l-1.6-1"/>
</svg>
