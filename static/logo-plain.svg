<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.6 9.3 34.1 34.5" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="2.8"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Знак разрезан пополам: слева половина сердца — донорство (с одной
       машины детали уходят в десяток других), справа половина шестерёнки —
       что именно мы снимаем. Поперёк — кардиограмма: машина «живая», пока
       с неё есть что взять.

       Половины стыкуются точно: обе начинаются в верхней впадине и
       заканчиваются в нижнем острие, поэтому силуэт читается одной
       фигурой, а не двумя приклеенными. Кривая сердца — не дуга, а
       настоящая сердечная кривая, иначе половина выглядит листом.
       Четыре зуба, а не шесть: в 24 px шесть сливаются в частокол.
       Эта копия без анимации — для печати, писем и мест, где
       шевелящийся знак неуместен. -->
  <path d="M24.00 40.00 C13.45 30.42 8.01 25.50 8.01 19.45 C8.01 14.53 11.88 10.66 16.80 10.66 C19.59 10.66 22.26 11.95 24.00 14.00"/>
  <path d="M24.00 14.00 A13.00 13.00 0 0 1 27.25 14.41 L28.58 11.04 A16.60 16.60 0 0 1 32.05 12.48 L30.60 15.80 A13.00 13.00 0 0 1 35.20 20.40 L38.52 18.95 A16.60 16.60 0 0 1 39.96 22.42 L36.59 23.75 A13.00 13.00 0 0 1 36.59 30.25 L39.96 31.58 A16.60 16.60 0 0 1 38.52 35.05 L35.20 33.60 A13.00 13.00 0 0 1 30.60 38.20 L32.05 41.52 A16.60 16.60 0 0 1 28.58 42.96 L27.25 39.59 A13.00 13.00 0 0 1 24.00 40.00"/>
  <path d="M10 27.0h4.4l2.2-5 3.4 9.2 2.3-5.4 1.6 3h4"/>
</svg>
