<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.8 3.4 42.4 41.8" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="3.0"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Фигура поделена вертикально пополам: слева половина сердца —
       донорство (с одной машины детали уходят в десяток других), справа
       половина шестерни — что именно мы снимаем. Поперёк кардиограмма:
       машина «живая», пока с неё есть что взять.

       Половины равны по-настоящему: стык — вертикаль от 9 до 41,
       доля сердца уходит влево на 19.7, вершины зубцов вправо на столько же.
       Кривая сердца — настоящая сердечная, а не дуга, иначе половина
       выглядит листом. Зубцы — трапеции по дуге, как у настоящей
       шестерни; пять штук: шесть в 24 px сливаются в частокол. -->
