<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.5 2.5 43.0 43.0" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="3.0"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Сердце с кардиограммой внутри зубчатого кольца: снаружи механика,
       внутри живое. Прошлый знак — сердце, разрезанное вертикальной
       чертой, — читался совсем не тем, чем задумывался: симметричные
       доли плюс линия по центру дают известный силуэт. Здесь этой черты
       нет вовсе, а смысл тот же: живое внутри механического.

       Бьётся только сердце с линией пульса, кольцо стоит: крутящаяся
       шестерёнка в шапке отвлекает от страницы. Анимация внутри файла,
       поэтому работает и когда знак вставлен картинкой; при
       prefers-reduced-motion гаснет. -->
