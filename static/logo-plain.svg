<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.2 3.4 52.4 41.8" role="img"
     aria-label="Автодонор" fill="none" stroke="#F54F0C" stroke-width="3.0"
     stroke-linecap="round" stroke-linejoin="round">
  <title>Автодонор</title>
  <!-- Нарисовано по эскизу заказчика. Фигура поделена вертикально
       пополам: слева половина сердца — донорство (с одной машины детали
       уходят в десяток других), справа половина шестерни — что именно мы
       снимаем. Кардиограмма идёт насквозь и выходит за края с обоих
       боков: на эскизе линия пересекает всю фигуру, а не прячется внутри.

       Половины равны по числам: стык — вертикаль от 9 до 41, доля
       сердца уходит влево на 19.7, вершины зубцов вправо на столько же.
       Кривая сердца — настоящая сердечная, а не дуга; зубцы — трапеции
       по дуге, как у настоящей шестерни. Пять зубцов: шесть в 24 px
       сливаются в частокол. Линия наклонена на 7°, как на рисунке. -->
